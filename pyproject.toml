[project]
name = "desktop-assistant"
version = "2.0.0"
description = "NLP-powered desktop assistant: intent classification, actions and voice support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nltk>=3.8", "scikit-learn>=1.3", "joblib>=1.3", "requests>=2.31"]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
dev = ["pytest>=8"]

[project.scripts]
desktop-assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
